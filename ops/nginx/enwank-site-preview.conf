# Review listener for the website on my.3enwank.com:8444, behind the staging password. Proxies to the
# website service (enwank-site.service, 127.0.0.1:3001). Replaces the static-folder version of this
# file. Install: install -m 0644 ops/nginx/enwank-site-preview.conf /etc/nginx/conf.d/enwank-site-preview.conf && nginx -t && systemctl reload nginx
server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    http2 on;
    server_name my.3enwank.com;
    ssl_certificate /etc/letsencrypt/live/my.3enwank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.3enwank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log /var/log/nginx/enwank-site-preview.access.log;
    error_log  /var/log/nginx/enwank-site-preview.error.log;

    auth_basic "3enwank website preview";
    auth_basic_user_file /etc/nginx/enwank-staging.htpasswd;

    # nginx: an add_header inside a location replaces the server-level set, so each location repeats them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://my.3enwank.com:8443; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://my.3enwank.com:8443" always;

    # The platform's Publish website button posts here with its token; no browser, no password.
    location ~ ^/api/revalidate/?$ {
        # The hook URL carries the token: keep it out of the access log.
        access_log off;
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/enwank-proxy-params.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/enwank-proxy-params.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/enwank-proxy-params.conf;
        # The reviewer must always see the current render: no browser caching of pages here.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://my.3enwank.com:8443; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://my.3enwank.com:8443" always;
    }
}
