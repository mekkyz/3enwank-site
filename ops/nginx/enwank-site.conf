# Production vhost for the website on 3enwank.com (README, "Going live"). Proxies to the website
# service on 127.0.0.1:3001. The certificate is obtained BEFORE the DNS change, through
# ops/nginx/enwank-site-acme.conf plus an ACME proxy on the old server:
#   certbot certonly --webroot -w /var/www/letsencrypt -d 3enwank.com -d www.3enwank.com
# Then, once the certificate exists:
#   rm -f /etc/nginx/conf.d/enwank-site-acme.conf
#   install -m 0644 ops/nginx/enwank-site.conf /etc/nginx/conf.d/enwank-site.conf && nginx -t && systemctl reload nginx
# The :80 block below keeps the challenge path so renewals keep working from here.

server {
    listen 80;
    listen [::]:80;
    server_name 3enwank.com www.3enwank.com;

    # Certificate renewals: certbot writes the token under this webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://3enwank.com$request_uri;
    }
}

# www redirects to the apex so every page has one address.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.3enwank.com;
    ssl_certificate /etc/letsencrypt/live/3enwank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3enwank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://3enwank.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 3enwank.com;

    ssl_certificate /etc/letsencrypt/live/3enwank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3enwank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/enwank-site.access.log;
    error_log  /var/log/nginx/enwank-site.error.log;

    client_max_body_size 64k;

    # nginx: an add_header inside a location replaces the server-level set, so each location repeats them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://my.3enwank.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://my.3enwank.com" always;

    # The platform's Publish website button posts here with its token.
    location ~ ^/api/revalidate/?$ {
        # The hook URL carries the token: keep it out of the access log.
        access_log off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/enwank-proxy-params.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Liveness for the deploy script and monitors.
    location ~ ^/api/health/?$ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/enwank-proxy-params.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/enwank-proxy-params.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/enwank-proxy-params.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://my.3enwank.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://my.3enwank.com" always;
    }
}
