# Only the :80 half of enwank-status.conf, so certbot can validate status.3enwank.com before the
# :443 server exists (that server names a certificate file, and nginx refuses to load it until the
# file is there). Install it, obtain the certificate, then install enwank-status.conf and delete this
# file (the steps are at the top of enwank-status.conf).
server {
    listen 80;
    listen [::]:80;
    server_name status.3enwank.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}
