# The public status page, status.3enwank.com (platform repo, docs/design/status-page.md 6.1 and 10).
# A server of its own that proxies exactly two addresses into the website service: / to /status/ and
# /ar/ to /ar/status/. Nothing else of the site answers on this name, so a mistake in the app cannot
# publish the storefront under it; everything else redirects to 3enwank.com.
#
# Order (the certificate has to exist before this file can load):
#   1. DNS: "status" with the same A (and AAAA) records as the apex.
#   2. install -m 0644 ops/nginx/enwank-status-acme.conf /etc/nginx/conf.d/enwank-status-acme.conf && nginx -t && systemctl reload nginx
#   3. certbot certonly --webroot -w /var/www/letsencrypt -d status.3enwank.com
#   4. install -m 0644 ops/nginx/enwank-status.conf /etc/nginx/conf.d/enwank-status.conf
#      rm -f /etc/nginx/conf.d/enwank-status-acme.conf && nginx -t && systemctl reload nginx
# The :80 block below keeps the challenge path, so renewals keep working.

server {
    listen 80;
    listen [::]:80;
    server_name status.3enwank.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://status.3enwank.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.3enwank.com;

    ssl_certificate /etc/letsencrypt/live/status.3enwank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.3enwank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/enwank-status.access.log;
    error_log  /var/log/nginx/enwank-status.error.log;

    # The page accepts nothing.
    client_max_body_size 16k;

    # An add_header inside a location replaces the server-level set, so every location repeats them.
    # HSTS without includeSubDomains, like the apex (enwank-site.conf says why).
    # The policy is the site's without Cloudflare Turnstile: this page has no form and loads nothing
    # from another host.

    location = / {
        proxy_pass http://127.0.0.1:3001/status/;
        include /etc/nginx/enwank-proxy-params.conf;
        # Rendered per request from a feed that changes every minute: a browser asks again every time.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location = /ar/ {
        proxy_pass http://127.0.0.1:3001/ar/status/;
        include /etc/nginx/enwank-proxy-params.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location = /ar {
        return 301 https://status.3enwank.com/ar/;
    }

    # While the site's STATUS_URL is still empty (go-live step 7) the page links its other language as
    # /status/ or /ar/status/. On this host those would fall to the catch-all and leave for the apex, so
    # they come back to this host's own two addresses instead.
    location ~ ^/(ar/)?status/?$ {
        return 301 https://status.3enwank.com/$1;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/enwank-proxy-params.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # The icons and the wordmark the page's head and header use, and nothing else from public/.
    location ~ ^/(favicon\.ico|favicon-16\.png|favicon-32\.png|apple-icon-180\.png|icon-192\.png|wordmark\.png|wordmark-64\.png)$ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/enwank-proxy-params.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location / {
        return 301 https://3enwank.com$request_uri;
    }
}
