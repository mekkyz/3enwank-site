# Catch-all listener that answers the ACME http-01 challenge whatever Host the request carries. It
# existed so this box could be validated for 3enwank.com while the
# name still resolves to the old server (README, "Going live", step 2). srv1 proxies
# /.well-known/acme-challenge/ here, so the certificate exists before any traffic moves and visitors
# whose browsers remember the old HSTS header never meet a certificate error.
#
# Install:  install -d -m 0755 /var/www/letsencrypt
#           install -m 0644 ops/nginx/enwank-site-acme.conf /etc/nginx/conf.d/enwank-site-acme.conf
#           nginx -t && systemctl reload nginx
# The named vhost has its own copy of the challenge location, so this one only catches requests
# addressed to the bare address, which is what the old server's proxy sends. Delete it once that
# proxy is gone.
# default_server plus the bare address: the old server proxies the challenge here, and if its proxy
# does not preserve the Host header the request arrives addressed to the IP. Answering it either way
# means the certificate cannot fail for that reason. Unmatched HTTP to this box now returns 404
# instead of a redirect to a name it does not hold, which is the more honest answer anyway.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 159.195.68.162 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    # Nothing else is served from here yet; the name still belongs to the old server.
    location / {
        return 404;
    }
}
