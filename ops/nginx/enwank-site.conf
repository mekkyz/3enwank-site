# Production vhost for the website on 3enwank.com (README, "Going live"). Proxies to the website
# service on 127.0.0.1:3001. The certificate is obtained BEFORE the DNS change, through
# ops/nginx/enwank-site-acme.conf plus an ACME proxy on the old server:
#   certbot certonly --webroot -w /var/www/letsencrypt -d 3enwank.com -d www.3enwank.com
# Then, once the certificate exists:
#   rm -f /etc/nginx/conf.d/enwank-site-acme.conf
#   install -m 0644 ops/nginx/enwank-site.conf /etc/nginx/conf.d/enwank-site.conf && nginx -t && systemctl reload nginx
# The :80 block below keeps the challenge path so renewals keep working from here.

server {
    listen 80;
    listen [::]:80;
    server_name 3enwank.com www.3enwank.com;

    # Certificate renewals: certbot writes the token under this webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://3enwank.com$request_uri;
    }
}

# www redirects to the apex so every page has one address.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.3enwank.com;
    ssl_certificate /etc/letsencrypt/live/3enwank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3enwank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://3enwank.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 3enwank.com;

    ssl_certificate /etc/letsencrypt/live/3enwank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3enwank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/enwank-site.access.log;
    error_log  /var/log/nginx/enwank-site.error.log;

    client_max_body_size 64k;

    # nginx: an add_header inside a location replaces the server-level set, so each location repeats them.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The platform's Publish website button posts here with its token.
    location ~ ^/api/revalidate/?$ {
        # The hook URL carries the token: keep it out of the access log.
        access_log off;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/enwank-proxy-params.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Liveness for the deploy script and monitors.
    location ~ ^/api/health/?$ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/enwank-proxy-params.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ------------------------------------------------------------------------------------------
    # The platform: the customer portal and store, served by enwank-web under /account so a customer
    # never changes address between browsing and buying. The zones, the scrubbing log format and
    # $enwank_csp are declared at http level in the platform repo's ops/nginx/enwank-production.conf,
    # which is still included for exactly that reason and for the my.3enwank.com redirect.
    #
    # Plain "location /account/", never "^~": that would short-circuit regex matching and silently
    # disable the credential rate limiter below. An add_header inside a location replaces the
    # server-level set, so every one of these repeats the whole header set.
    #
    # The platform's own policy is used, not the site's: it must allow form-action to the hosting
    # servers, because the one-click cPanel login answers a form POST with a redirect to srvN.
    # ------------------------------------------------------------------------------------------

    location = /account/api/health {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/enwank-proxy-params.conf;
        access_log off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $enwank_csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Payment and registrar callbacks. Their own bucket, so a provider burst is never dropped.
    location ^~ /account/api/webhooks/ {
        limit_req zone=enwank_hooks burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/enwank-proxy-params.conf;
        access_log /var/log/nginx/enwank-production.access.log enwank;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $enwank_csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ^~ /account/api/public/ {
        limit_req zone=enwank_pages burst=200 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/enwank-proxy-params.conf;
        proxy_hide_header Set-Cookie;
        access_log /var/log/nginx/enwank-production.access.log enwank;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $enwank_csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ^~ /account/_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/enwank-proxy-params.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $enwank_csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Credential pages: every one turns into an argon2 hash or a database write.
    location ~ ^/account/(login|register|forgot-password|reset-password|verify-email)(/|$) {
        limit_req zone=enwank_auth burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/enwank-proxy-params.conf;
        client_max_body_size 2m;
        access_log /var/log/nginx/enwank-production.access.log enwank;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $enwank_csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # A prefix location does not match the bare path, so /account needs its own.
    location = /account {
        limit_req zone=enwank_pages burst=200 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/enwank-proxy-params.conf;
        access_log /var/log/nginx/enwank-production.access.log enwank;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $enwank_csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /account/ {
        limit_req zone=enwank_pages burst=200 nodelay;
        limit_conn enwank_conn 40;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/enwank-proxy-params.conf;
        # Ticket attachments are 10 MB (settings.support.maxAttachmentBytes) plus form overhead; the
        # server-level 64k here is sized for the marketing site, which accepts nothing.
        client_max_body_size 20m;
        client_body_timeout 15s;
        access_log /var/log/nginx/enwank-production.access.log enwank;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $enwank_csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Safety net, not the routing contract. A form submitted before the page finishes hydrating gets a
    # redirect from Next that is missing the basePath (the MPA branch of its action handler does not
    # add it), and any hand-written absolute link has the same problem. Without this the customer would
    # land on the marketing site's 404 after a successful login. None of these paths belongs to the
    # site: it owns /, /hosting/, /websites/, /care/, /domains/, /about/, /terms/, /privacy/ and the
    # Arabic trees. /domains/search is matched exactly so the site's own /domains/ page is untouched.
    location ~ ^/(login|register|forgot-password|reset-password|verify-email|dashboard|admin|cart|checkout|invoices|services|tickets|plans|profile|security|payment-methods)(/|$) {
        return 308 https://3enwank.com/account$request_uri;
    }
    location = /domains/search {
        return 308 https://3enwank.com/account$request_uri;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/enwank-proxy-params.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/enwank-proxy-params.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
